# Use postgres/example user/password credentials

services:
#  backend:
#     TODO
#  frontend:
#     TODO
  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
# лучше делать через .env для безопасности
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
# нужен для корректной работы, при подымании нескольких сервесов, по сути будет нужен только после того, как сделаем bd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
# нужен для тестировки, потом уберу, если не убрать, то может произойти утечка
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  db-data:
