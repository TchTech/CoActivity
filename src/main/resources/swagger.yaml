openapi: 3.0.0
info:
  title: CoActivity API
  description: API test
  version: 1.0.0

#servers:
#  - url: 'http://coactivity_app:8080/api/v1'

tags:
  - name: Auth
    description: Авторизация и регистрация
  - name: Users
    description: Управление пользователями и профилем
  - name: Rooms
    description: Управление комнатами и чатами
  - name: Posts
    description: Посты и комментарии

paths:
  # --- AUTH ---
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация (после смены профиля)
      description: Создание нового аккаунта
      operationId: registerNewUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Регистрация успешна, новый пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации или email занят

  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в аккаунт (после смены профиля)
      description: Вход в уже существующий аккаунт
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT токен доступа
                  userId:
                    type: integer
                    description: ID пользователя
        '401':
          description: Неверный логин или пароль

  # --- USERS ---
  /users/{id}/profile:
    get:
      tags:
        - Users
      summary: Войти в свой профиль
      operationId: getUserProfile
      parameters:
        - name: id
          in: path
          required: true
          description: ID текущего пользователя
          schema:
            type: integer
      responses:
        '200':
          description: Данные пользователя успешно получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден

  /users/{id}/profile/logout:
    post:
      tags:
        - Users
      summary: Сменить профиль (Выход)
      description: Пользователь нажимает "Сменить профиль". Текущая сессия завершается.
      operationId: changeUserProfile
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя, который выходит из системы
          schema:
            type: integer
      responses:
        '200':
          description: Успешный выход. Далее клиент должен перенаправить на Login/Register.
        '404':
          description: Пользователь не найден

  /users/{id}/profile/personal-info:
    get:
      tags:
        - Users
      summary: Просмотр персональной информации пользователя
      operationId: getPersonalInfo
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      responses:
        '200':
          description: Персональная информация успешно получена
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
                  address:
                    type: string
        '404':
          description: Пользователь не найден

  /users/{id}/profile/personal-info/name:
    put:
      tags:
        - Users
      summary: Изменить имя пользователя
      operationId: updateUserName
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Имя пользователя успешно обновлено
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{id}/profile/personal-info/email:
    put:
      tags:
        - Users
      summary: Изменить email пользователя
      operationId: updateUserEmail
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Email пользователя успешно обновлен
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{id}/profile/personal-info/phone:
    put:
      tags:
        - Users
      summary: Изменить телефон пользователя
      operationId: updateUserPhone
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: Телефон пользователя успешно обновлен
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{id}/profile/personal-info/address:
    put:
      tags:
        - Users
      summary: Изменить адрес пользователя
      operationId: updateUserAddress
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
      responses:
        '200':
          description: Адрес пользователя успешно обновлен
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{id}/profile/external-links:
    get:
      tags:
        - Users
      summary: Получить список внешних ссылок
      operationId: getUserExternalLinks
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      responses:
        '200':
          description: Список внешних ссылок успешно получен
        '404':
          description: Пользователь не найден
    post:
      tags:
        - Users
      summary: Добавить внешнюю ссылку
      description: Добавляет информацию о стороннем ресурсе в профиль
      operationId: addExternalLink
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platformName:
                  type: string
                  description: Название платформы (например, Telegram, GitHub, LinkedIn)
                  example: Telegram
                url:
                  type: string
                  description: Ссылка на профиль
                  example: https://t.me/username
      responses:
        '201':
          description: Ссылка успешно добавлена
        '400':
          description: Некорректные данные (например, невалидный URL)
        '404':
          description: Пользователь не найден

  /users/{id}/profile/external-links/{linkId}:
    delete:
      tags:
        - Users
      summary: Удалить внешнюю ссылку
      operationId: deleteExternalLink
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
        - name: linkId
          in: path
          required: true
          description: ID ссылки, которую нужно удалить
          schema:
            type: integer
      responses:
        '200':
          description: Ссылка успешно удалена
        '404':
          description: Ссылка или пользователь не найдены

  /users/{userId}/profile/view:
    get:
      tags:
        - Users
      summary: Посмотреть профиль другого пользователя
      operationId: viewUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чей профиль нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Профиль пользователя успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
        '403':
          description: У пользователя нет прав для просмотра этого профиля (например, если профиль скрыт)
    post:
      tags:
        - Users
      summary: Выполнить действия с профилем (заблокировать, добавить в друзья, общие комнаты)
      operationId: userProfileActions
      parameters:
        - name: userId
          in: path
          required: true
          description: ID текущего пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - block
                    - addFriend
                    - getCommonRooms
                  description: Действие, которое пользователь хочет выполнить
                targetUserId:
                  type: integer
                  description: ID другого пользователя (для блокировки или добавления в друзья)
      responses:
        '200':
          description: Действие успешно выполнено
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден
        '409':
          description: Ошибка , если пользователь уже заблокирован или добавлен в дрзья

  /users/{userId}/profile/view/friend-request:
    post:
      tags:
        - Users
      summary: Принять запрос в друзья
      operationId: acceptFriendRequest
      parameters:
        - name: userId
          in: path
          required: true
          description: ID текущего пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: integer
                  description: ID пользователя, который отправил запрос в друзья
      responses:
        '200':
          description: Запрос в друзья успешно принят
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден
        '409':
          description: Запрос уже принят или отклонен

  /users/{userId}/profile/view/friend-request/decline:
    post:
      tags:
        - Users
      summary: Отклонить запрос в друзья
      operationId: declineFriendRequest
      parameters:
        - name: userId
          in: path
          required: true
          description: ID текущего пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: integer
                  description: ID пользователя, который отправил запрос в друзья
      responses:
        '200':
          description: Запрос в друзья успешно отклонен
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден
        '409':
          description: Запрос уже принят или отклонен

  /users/{userId}/rooms:
    get:
      tags:
        - Users
      summary: Получить список своих комнат
      operationId: getUserRooms
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи комнаты нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Список комнат пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '404':
          description: Пользователь не найден или у пользователя нет комнат

  /users/{userId}/rooms/filter:
    get:
      tags:
        - Users
      summary: Фильтровать комнаты по времени или важности
      operationId: filterRooms
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи комнаты нужно фильтровать
          schema:
            type: integer
        - name: filterBy
          in: query
          required: true
          description: Критерий фильтрации (по времени или важности)
          schema:
            type: string
            enum:
              - time
              - importance
        - name: order
          in: query
          required: false
          description: Порядок сортировки (по возрастанию или убыванию)
          schema:
            type: string
            enum:
              - ascending
              - descending
      responses:
        '200':
          description: Список отфильтрованных комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '404':
          description: Комнаты не найдены

  /users/{userId}/rooms/folder:
    post:
      tags:
        - Users
      summary: Создать папку для комнат
      operationId: createRoomFolder
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, который создаёт папку
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderName:
                  type: string
                  description: Название папки для комнат
      responses:
        '201':
          description: Папка успешно создана
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{userId}/rooms/folder/{folderId}/delete:
    delete:
      tags:
        - Users
      summary: Удалить папку для комнат
      operationId: deleteRoomFolder
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, который удаляет папку
          schema:
            type: integer
        - name: folderId
          in: path
          required: true
          description: ID папки, которую нужно удалить
          schema:
            type: integer
      responses:
        '200':
          description: Папка успешно удалена
        '400':
          description: Некорректные данные (например, папка не пуста)
        '404':
          description: Папка или пользователь не найдены

  /users/{userId}/rooms/folder/{folderId}/update:
    put:
      tags:
        - Users
      summary: Изменить название папки для комнат
      operationId: updateRoomFolder
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, который изменяет папку
          schema:
            type: integer
        - name: folderId
          in: path
          required: true
          description: ID папки, которую нужно изменить
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderName:
                  type: string
                  description: Новое название папки
      responses:
        '200':
          description: Папка успешно изменена
        '400':
          description: Некорректные данные
        '404':
          description: Папка или пользователь не найдены

  /users/{userId}/rooms/{roomId}:
    get:
      tags:
        - Users
      summary: Просмотреть информацию о конкретной комнате
      operationId: getRoomDetails
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи комнаты нужно просмотреть
          schema:
            type: integer
        - name: roomId
          in: path
          required: true
          description: ID комнаты, которую пользователь хочет просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Информация о комнате успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Комната или пользователь не найдены
        '403':
          description: Пользователь не имеет доступа к этой комнате

  /users/{userId}/settings:
    get:
      tags:
        - Users
      summary: Получить текущие настройки пользователя
      operationId: getUserSettings
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи настройки нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Текущие настройки пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationsEnabled:
                    type: boolean
                    description: Включены ли уведомления
                  privacy:
                    type: object
                    properties:
                      profileVisibility:
                        type: string
                        enum:
                          - public
                          - private
                          - friends
                        description: Кто может видеть профиль
                  language:
                    type: string
                    description: Язык интерфейса
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/notifications:
    get:
      tags:
        - Users
      summary: Получить текущие настройки уведомлений
      operationId: getUserNotificationSettings
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      responses:
        '200':
          description: Текущие настройки уведомлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomInvitationNotifications:
                    type: boolean
                    description: Уведомления о приглашениях в комнаты
                  messageNotifications:
                    type: boolean
                    description: Уведомления о новых сообщениях
                  roomRemovalNotifications:
                    type: boolean
                    description: Уведомления об удалении из комнаты
                  # Оставляем старые поля, если они нужны для совместимости, или заменяем новыми правилами
                  emailNotifications:
                    type: boolean
                  pushNotifications:
                    type: boolean
        '404':
          description: Пользователь не найден
    put:
      tags:
        - Users
      summary: Изменить общие правила отправки уведомлений
      description:
        Настройка глобальных правил: приглашения, сообщения, удаление из комнат
      operationId: updateUserNotificationSettings
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomInvitationNotifications:
                  type: boolean
                  description: Включить/отключить уведомления о приглашениях в комнаты
                messageNotifications:
                  type: boolean
                  description: Включить/отключить уведомления о сообщениях
                roomRemovalNotifications:
                  type: boolean
                  description: Включить/отключить уведомления об удалении из комнат
      responses:
        '200':
          description: Общие настройки уведомлений успешно обновлены
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/general-notifications:
    get:
      tags:
        - Users
      summary: Просмотр общих настроек уведомлений пользователя
      operationId: getGeneralNotificationSettings
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи общие настройки уведомлений нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Общие настройки уведомлений успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailNotifications:
                    type: boolean
                    description: Включены ли email уведомления
                  pushNotifications:
                    type: boolean
                    description: Включены ли push уведомления
        '404':
          description: Пользователь не найден
    put:
      tags:
        - Users
      summary: Обновить общие настройки уведомлений пользователя
      operationId: updateGeneralNotificationSettings
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи общие настройки уведомлений нужно обновить
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailNotifications:
                  type: boolean
                  description: Включить или отключить email уведомления
                pushNotifications:
                  type: boolean
                  description: Включить или отключить push уведомления
      responses:
        '200':
          description: Общие настройки уведомлений успешно обновлены
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/privacy-and-recommendations:
    get:
      tags:
        - Users
      summary: Просмотр политики конфиденциальности и настроек рекомендаций
      operationId: getPrivacyAndRecommendations
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи настройки конфиденциальности и рекомендации нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Политика конфиденциальности и настройки рекомендаций успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacyPolicy:
                    type: string
                    description: Политика конфиденциальности
                  recommendationSettings:
                    type: object
                    properties:
                      roomRecommendations:
                        type: boolean
                        description: Включены ли рекомендации комнат
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/room-recommendations:
    put:
      tags:
        - Users
      summary: Изменить настройки рекомендаций комнат
      operationId: updateRoomRecommendations
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи настройки рекомендаций нужно обновить
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomRecommendations:
                  type: boolean
                  description: Включить или выключить рекомендации комнат
      responses:
        '200':
          description: Настройки рекомендаций комнат успешно обновлены
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/friends-data-access:
    put:
      tags:
        - Users
      summary: Изменить информацию о друзьях и их доступе к данным
      operationId: updateFriendsDataAccess
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, чьи данные нужно обновить
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                friendsAccess:
                  type: string
                  enum:
                    - all
                    - specific
                    - none
                  description: Тип доступа друзей к данным (все, конкретные друзья, нет доступа)
      responses:
        '200':
          description: Информация о друзьях и их доступе к данным успешно обновлена
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  /users/{userId}/settings/data-links-access:
    put:
      tags:
        - Users
      summary: Изменить доступность ссылок и данных для других пользователей
      operationId: updateDataLinksAccess
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя, для которого нужно обновить доступность данных
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataLinksAccess:
                  type: string
                  enum:
                    - public
                    - friends
                    - private
                  description: Доступность ссылок и данных для других пользователей
      responses:
        '200':
          description: Доступность ссылок и данных успешно обновлена
        '400':
          description: Некорректные данные
        '404':
          description: Пользователь не найден

  # --- ROOMS ---
  /rooms:
    post:
      tags:
        - Rooms
      summary: Создать новую комнату
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Описание комнаты
                category:
                  type: string
                  description: Категория комнаты
                maxCollaborators:
                  type: integer
                  description: Максимальное количество участников
                meetingTime:
                  type: string
                  format: date-time
                  description: Время начала встречи
                meetingType:
                  type: string
                  enum:
                    - online
                    - offline
                  description: Тип встречи
                location:
                  type: string
                  description: Локация встречи, если тип оффлайн
                  nullable: true
      responses:
        '201':
          description: Комната успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Некорректные данные (например, если количество участников превышает лимит)

  /rooms/{roomId}/join:
    post:
      tags:
        - Rooms
      summary: Присоединиться к созданной комнате
      operationId: joinRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты, к которой пользователь хочет присоединиться
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: ID пользователя, который хочет присоединиться
      responses:
        '200':
          description: Пользователь успешно присоединился к комнате
        '400':
          description: Некорректные данные
        '404':
          description: Комната не найдена
        '409':
          description: Ошибка если количество участников достигло лимита

  /rooms/{roomId}/join-requests/{targetUserId}/approve:
    post:
      tags:
        - Rooms
      summary: Разрешить пользователю вход в комнату
      description: Администратор одобряет заявку на вход, пользователь добавляется в комнату
      operationId: approveJoinRequest
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
        - name: targetUserId
          in: path
          required: true
          description: ID пользователя, которого нужно пустить в комнату
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId:
                  type: integer
                  description: ID администратора, который разрешает вход
      responses:
        '200':
          description: Вход разрешен, пользователь добавлен в комнату
        '403':
          description: Только администратор может разрешать вход
        '404':
          description: Комната или пользователь не найдены

  /rooms/{roomId}/join-requests/{targetUserId}/reject:
    post:
      tags:
        - Rooms
      summary: Не разрешить пользователю вход
      description: Администратор отклоняет заявку пользователя на вход
      operationId: rejectJoinRequest
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
        - name: targetUserId
          in: path
          required: true
          description: ID пользователя, которому запрещают вход
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId:
                  type: integer
                  description: ID администратора, который запрещает вход
      responses:
        '200':
          description: Вход запрещен, заявка отклонена
        '403':
          description: Только администратор может запрещать вход
        '404':
          description: Комната или пользователь не найдены

  /rooms/{roomId}/brief:
    get:
      tags:
        - Rooms
      summary: Получить краткое описание комнаты
      operationId: getRoomBrief
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты, которую нужно просмотреть
          schema:
            type: integer
      responses:
        '200':
          description: Краткое описание комнаты
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: integer
                    description: ID комнаты
                  briefDescription:
                    type: string
                    description: Краткое описание комнаты
        '404':
          description: Комната не найдена

  /rooms/{roomId}/chat:
    get:
      tags:
        - Rooms
      summary: Открыть чат комнаты
      operationId: openRoomChat
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты, в которой пользователь хочет открыть чат
          schema:
            type: integer
      responses:
        '200':
          description: Чат комнаты успешно открыт
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: integer
                    description: ID комнаты
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        senderId:
                          type: integer
                          description: ID отправителя сообщения
                        content:
                          type: string
                          description: Содержание сообщения
                        timestamp:
                          type: string
                          format: date-time
                          description: Время отправки сообщения
        '404':
          description: Комната не найдена
        '403':
          description: Пользователь не присоединился к комнате

  /rooms/{roomId}/chat/messages:
    post:
      tags:
        - Rooms
      summary: Написать сообщение в чате
      description: Пользователь отправляет сообщение в чат комнаты
      operationId: sendRoomMessage
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senderId:
                  type: integer
                  description: ID пользователя, который пишет сообщение
                content:
                  type: string
                  description: Текст сообщения
      responses:
        '201':
          description: Сообщение успешно отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Пользователь не является участником комнаты
        '404':
          description: Комната не найдена

  /rooms/{roomId}/chat/messages/{messageId}/report:
    post:
      tags:
        - Rooms
      summary: Пожаловаться на сообщение
      description: Пользователь отправляет жалобу на сообщение (нарушение правил площадки или комнаты)
      operationId: reportMessage
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          description: ID сообщения, на которое поступает жалоба
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reporterId:
                  type: integer
                  description: ID пользователя, который отправляет жалобу
                violationType:
                  type: string
                  enum:
                    - platformRules
                    - roomRules
                  description: Тип нарушения (правила площадки или правила комнаты)
                comment:
                  type: string
                  description: Комментарий к жалобе (опционально)
      responses:
        '200':
          description: Жалоба успешно отправлена на проверку администрации
        '404':
          description: Сообщение или комната не найдены

  /rooms/{roomId}/chat/messages/{messageId}/moderation/confirm:
    post:
      tags:
        - Rooms
      summary: Подтвердить нарушение правила
      description: Администратор подтверждает нарушение. Сообщение удаляется, пользователь получает предупреждение или блокировку.
      operationId: confirmMessageViolation
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          description: ID сообщения
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId:
                  type: integer
                  description: ID администратора, проводящего проверку
                sanction:
                  type: string
                  enum:
                    - warning
                    - kick
                    - ban
                  description: Вид санкции (предупреждение, исключение из комнаты, блокировка)
      responses:
        '200':
          description: Нарушение подтверждено, сообщение удалено, меры приняты
        '403':
          description: Недостаточно прав (только для администратора)
        '404':
          description: Сообщение не найдено

  /rooms/{roomId}/chat/messages/{messageId}/moderation/reject:
    post:
      tags:
        - Rooms
      summary: Отклонить жалобу на нарушение
      description: Администратор не находит нарушений, сообщение остается в чате
      operationId: rejectMessageViolation
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          description: ID сообщения
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId:
                  type: integer
                  description: ID администратора, проводящего проверку
      responses:
        '200':
          description: Нарушений не замечено, жалоба отклонена
        '403':
          description: Недостаточно прав (только для администратора)
        '404':
          description: Сообщение не найдено

  /rooms/{roomId}/settings/notifications:
    get:
      tags:
        - Rooms
      summary: Просмотр настроек уведомлений для конкретной комнаты
      operationId: getRoomNotificationSettings
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
      responses:
        '200':
          description: Уведомления для комнаты успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitationNotifications:
                    type: boolean
                    description: Уведомления о приглашениях в комнату
                  messageNotifications:
                    type: boolean
                    description: Уведомления о новых сообщениях в комнате
                  removalNotifications:
                    type: boolean
                    description: Уведомления об удалении из комнаты
        '404':
          description: Комната не найдена
    put:
      tags:
        - Rooms
      summary: Добавить/изменить правила уведомлений для конкретной комнаты
      operationId: updateRoomNotificationSettings
      parameters:
        - name: roomId
          in: path
          required: true
          description: ID комнаты
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationNotifications:
                  type: boolean
                  description: Включить/отключить уведомления о приглашениях
                messageNotifications:
                  type: boolean
                  description: Включить/отключить уведомления о сообщениях
                removalNotifications:
                  type: boolean
                  description: Включить/отключить уведомления об удалении
      responses:
        '200':
          description: Настройки уведомлений комнаты успешно обновлены
        '400':
          description: Некорректные данные
        '404':
          description: Комната не найдена

  # --- POSTS ---
  /posts:
    post:
      tags:
        - Posts
      summary: Создать новый пост
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Пост успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /posts/{postId}/comments:
    post:
      tags:
        - Posts
      summary: Создать комментарий для поста
      operationId: createComment
      parameters:
        - name: postId
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '201':
          description: Комментарий успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

components:
  schemas:
    InterestCategory:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        id:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: integer
        collaborators:
          type: array
          items:
            type: integer
        date:
          type: string
          format: date-time
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer

    User:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        id:
          type: integer
        passwordHash:
          type: string
        rooms:
          type: array
          items:
            type: integer
        interests:
          type: array
          items:
            type: integer
        feedbacks:
          type: array
          items:
            type: integer
        feedbacksAuthor:
          type: array
          items:
            type: integer
        createdAt:
          type: string
          format: date-time

    Room:
      type: object
      properties:
        adminId:
          type: array
          items:
            type: integer
        id:
          type: integer
        description:
          type: string
        category:
          type: string
        collaborators:
          type: array
          items:
            type: integer
        interestType:
          type: integer
        geolocation:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
        maxCollaborators:
          type: integer

    Post:
      type: object
      properties:
        authorId:
          type: array
          items:
            type: integer
        id:
          type: integer
        text:
          type: string
        likedUsers:
          type: array
          items:
            type: integer
        dislikedUsers:
          type: array
          items:
            type: integer
        comments:
          type: array
          items:
            type: integer
        room:
          type: integer
        image:
          type: string

    Interest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        id:
          type: integer

    Comment:
      type: object
      properties:
        authorId:
          type: array
          items:
            type: integer
        id:
          type: integer
        text:
          type: string
        likedUsers:
          type: array
          items:
            type: integer
        dislikedUsers:
          type: array
          items:
            type: integer
        post:
          type: integer

    Image:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
          format: byte

    Feedback:
      type: object
      properties:
        authorId:
          type: array
          items:
            type: integer
        id:
          type: integer
        text:
          type: string
        userId:
          type: integer